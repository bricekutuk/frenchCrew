<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver</title>
    <link rel="stylesheet" href="reserver.css">
</head>
<nav>

</nav>
<body>
  <main>
    <section class="reservation">
      <h1>Réserver votre séjour</h1>
      <p>Choisissez le nombre de personnes, les dates et l’offre souhaitée.</p>

      <form action="#" method="post">
        
        <div>
          <label for="guests">Nombre de personnes :</label>
          <select id="guests" name="guests" required>
            <option value="">-- Choisir --</option>
            <option value="1">1 personne</option>
            <option value="2">2 personnes</option>
            <option value="3">3 personnes</option>
            <option value="4">4 personnes</option>
          </select>
        </div>

        <div>
          <label for="checkin">Date d'arrivée :</label>
          <input type="date" id="checkin" name="checkin" required>
        </div>

        <div>
          <label for="checkout">Date de départ :</label>
          <input type="date" id="checkout" name="checkout" required>
        </div>

        <div>
          <label for="offer">Choix de l’offre :</label>
          <select id="offer" name="offer" required>
            <option value="">-- Choisir une offre --</option>
            <option value="basic">Basique</option>
            <option value="medium">Medium</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <div>
          <a href="paiement.html" class="btn">Réserver et Payer</a>
        </div>

      </form>
    </section>
  </main>
</body>
<footer>

</footer>
</html>
